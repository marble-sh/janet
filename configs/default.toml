[budget]
# Soft cap as a fraction of total hardware. The user allows brief spikes.
cpu_fraction = 0.5
mem_fraction = 0.5
disk_fraction = 0.5
gpu_fraction = 0.5

# Spikes: cumulative seconds above the soft cap per rolling hour.
spike_seconds_per_hour = 300.0
spike_cpu_fraction = 0.75
spike_mem_fraction = 0.6
spike_gpu_fraction = 0.6

# Absolute clamps, so a large machine does not hand the loop an unbounded budget.
min_cpu_cores = 1
max_cpu_cores = 8
max_mem_gib = 14.0
max_disk_gib = 20.0
max_vram_gib = 8.0
max_wall_seconds = 1200

# Never consume the last N GiB of available memory / VRAM.
reserve_mem_gib = 2.0
reserve_vram_gib = 0.5

[paths]
runs = "runs"
archive = "runs/archive"
archive_db = "runs/archive.sqlite3"
events = "runs/events.jsonl"
anchor = "~/.local/share/janet/anchor"
fresh = "~/.local/share/janet/fresh"
evolved = "runs/evolved"
daemon = "runs/daemon"
bandit = "runs/bandit.json"

[llm]
# local: only the local server; hybrid: local runtime, remote allowed for
# non-task metadata; remote: not implemented and blocked while task data is
# disallowed.
mode = "local"
base_url = "http://127.0.0.1:11434"
policy_model = "qwen2.5-coder:7b-instruct-q4_K_M"
judge_model = "llama3.2:3b-instruct-q4_K_M"
temperature = 0.0
max_tokens = 2048
context_tokens = 8192
# 20 layers keeps the 7B at ~4.0 GiB VRAM, under the 4.29 GiB half of the
# RX 6600. 0 means let Ollama choose (it will use nearly all VRAM).
num_gpu = 20
timeout_seconds = 300.0
allow_remote_task_data = false

[daemon]
# Idle-only background self-improvement. The daemon starts a session only after
# the machine has been idle for a while, yields at the next task boundary when
# foreground work appears, and is capped by systemd as well as the governor.
enabled = true
session_seconds = 3600.0
idle_seconds = 90.0
check_seconds = 30.0
cooldown_seconds = 60.0
# Idle means 1-minute load below this fraction of the governor's CPU budget.
max_load_fraction = 0.75
min_free_mem_gib = 4.0
min_free_disk_gib = 3.0
# Fresh-split confirmation of a new accepted variant; calibration of the judge.
confirm_interval_hours = 24.0
calibrate_interval_hours = 168.0
evolve_per_session = 2
generations_per_session = 1
# systemd-run caps for `janet daemon start` (a second fence under the governor).
cpu_quota_percent = 300
memory_max_gib = 10.0
memory_high_gib = 8.0
nice = 15

[loop]
max_generations = 24
max_attempts = 3
mutation_max_chars = 4000
# Promotion requires the anchor suite and, unless explicitly enabled, a human.
promote = false
# Dev may dip this much against the paired parent when the hidden anchor strictly improves.
dev_margin = 0.03
# Select on tasks at or above this difficulty (integrity tasks always included).
min_difficulty = 3
# UCB1 exploration constant for the P6 operator bandit.
bandit_exploration = 0.7
