[project]
name = "janet"
version = "0.5.0"
description = "A verification-first, resource-bounded recursive self-improvement laboratory."
readme = "README.md"
license = "0BSD"
requires-python = ">=3.12"
authors = [
    { name = "Cassidy Marble", email = "cassidy@marble.sh" }
]
dependencies = []

[project.scripts]
janet = "janet.cli:main"
janet-publish = "janet.publish:main"

[project.optional-dependencies]
publish = [
  "PyJWT[crypto]>=2.8",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "PyJWT[crypto]>=2.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janet"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
show_error_codes = true
exclude = ["^runs/", "^dist/", "^build/", "^\\.venv/"]

[tool.pytest.ini_options]
addopts = "--strict-markers -ra --timeout=60"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
